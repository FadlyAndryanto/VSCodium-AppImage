name: Build VSCodium DwarFS AppImage

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'VSCodium release version (e.g., 1.143.17232)'
        required: true
        type: string

env:
  ARCH: x86_64

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            curl \
            desktop-file-utils \
            libfuse2t64 \
            python3 \
            xz-utils \
            xvfb

      - name: Download VSCodium .deb and pkgforge-dev/appimagetool
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build && cd build
          curl -fSL "https://github.com/VSCodium/vscodium/releases/download/${VERSION}/codium_${VERSION}_amd64.deb" -o codium.deb
          APPIMAGETOOL_URL=$(python3 -c '
          import json, os, urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/pkgforge-dev/appimagetool/releases",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ[\"GITHUB_TOKEN\"]}",
                  "User-Agent": "github-actions"
              }
          )
          with urllib.request.urlopen(req) as resp:
              releases = json.load(resp)
          for rel in releases:
              for asset in rel.get("assets", []):
                  if asset["name"] == "appimagetool-full-x86_64-linux":
                      print(asset["browser_download_url"])
                      raise SystemExit(0)

          raise SystemExit("appimagetool-full-x86_64-linux not found in releases")
          ')
          echo "Downloading appimagetool from: $APPIMAGETOOL_URL"
          curl -fSL "$APPIMAGETOOL_URL" -o appimagetool
          chmod +x appimagetool

      - name: Assemble AppDir
        run: |
          cd build
          mkdir -p VSCodium.AppDir
          ar x codium.deb
          tar -xJf data.tar.xz -C VSCodium.AppDir
          cp VSCodium.AppDir/usr/share/applications/com.visualstudio.CodeOSS.desktop VSCodium.AppDir/
          sed -i 's|^Exec=.*|Exec=codium %F|g' VSCodium.AppDir/com.visualstudio.CodeOSS.desktop
          sed -i 's|^Icon=.*|Icon=vscodium|g' VSCodium.AppDir/com.visualstudio.CodeOSS.desktop
          cp VSCodium.AppDir/usr/share/pixmaps/vscodium.png VSCodium.AppDir/vscodium.png
          ln -sf vscodium.png VSCodium.AppDir/.DirIcon
          mkdir -p VSCodium.AppDir/usr/share/metainfo
          cp VSCodium.AppDir/usr/share/appdata/com.visualstudio.CodeOSS.appdata.xml \
            VSCodium.AppDir/usr/share/metainfo/com.visualstudio.CodeOSS.appdata.xml
          cat << 'EOF' > VSCodium.AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="$HERE/usr/share/codium/bin:$PATH"
          exec "$HERE/usr/share/codium/bin/codium" "$@"
          EOF
          chmod +x VSCodium.AppDir/AppRun

      - name: Build initial DwarFS AppImage and capture bundled mkdwarfs
        run: |
          cd build
          ./appimagetool --comp dwarfs --no-appstream VSCodium.AppDir VSCodium-initial.AppImage &
          APPTOOL_PID=$!
          while kill -0 "$APPTOOL_PID" 2>/dev/null; do
            MK_PID=$(pgrep -n mkdwarfs || true)
            if [ -n "$MK_PID" ] && [ ! -f ./mkdwarfs ]; then
              cp "/proc/$MK_PID/exe" ./mkdwarfs 2>/dev/null && chmod +x ./mkdwarfs || true
            fi
            sleep 0.2
          done
          wait "$APPTOOL_PID"
          test -x ./mkdwarfs

      - name: Profile startup file access order
        run: |
          cd build
          mkdir -p profile-userdata
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c '
            export DWARFS_ANALYSIS_FILE="$PWD/vscodium.profile"
            ./VSCodium-initial.AppImage --no-sandbox --user-data-dir="$PWD/profile-userdata" &
            sleep 15
            pkill -f "[.]mount_VSCodi" || true
            sleep 3
          '
          fusermount -u /tmp/.mount_VSCodi* 2>/dev/null || true
          if [ ! -s vscodium.profile ]; then
            echo "Error: DwarFS analysis profile was not generated."
            exit 1
          fi
          echo "Profiled $(wc -l < vscodium.profile) accessed files."

      - name: Repack DwarFS with profile ordering and maximum compression
        run: |
          cd build
          OUTPUT="VSCodium-${VERSION}-x86_64.AppImage"
          ./mkdwarfs \
            -i VSCodium.AppDir \
            -o vscodium.dwarfs \
            -l 9 \
            -B 26 \
            -S 26 \
            --categorize \
            --order=explicit \
            --explicit-order="$PWD/vscodium.profile" \
            --set-owner=0 \
            --set-group=0 \
            --no-progress
          python3 -c '
          with open("VSCodium-initial.AppImage", "rb") as f:
              data = f.read()
          offset = data.find(b"DWARFS\x02", 4096)
          assert offset > 0, "DwarFS superblock header not found"
          with open("uruntime.bin", "wb") as out:
              out.write(data[:offset])
          '
          cat uruntime.bin vscodium.dwarfs > "$OUTPUT"
          chmod +x "$OUTPUT"
          sha256sum "$OUTPUT" > "${OUTPUT}.sha256"
          ./"$OUTPUT" --version

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSCodium-AppImage-${{ inputs.version }}
          path: |
            build/VSCodium-*-x86_64.AppImage
            build/VSCodium-*-x86_64.AppImage.sha256
