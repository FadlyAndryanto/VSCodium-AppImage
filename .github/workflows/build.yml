name: Build VSCodium AppImage (DwarFS + Profile)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  DWARFS_COMP: "zstd:level=22 -S26 -B2"
  OPTIMIZE_LAUNCH: "1"
  OPTIMIZE_LAUNCH_TIMEOUT: "15"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest VSCodium release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh api repos/VSCodium/vscodium/releases/latest --jq '.tag_name')
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest upstream version: $LATEST"
          if gh release view "$LATEST" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "already_released=true" >> $GITHUB_OUTPUT
            echo "Version $LATEST already exists in this repo → skipping"
          else
            echo "already_released=false" >> $GITHUB_OUTPUT
            echo "New version detected → will build"
          fi

      - name: Skip if already released
        if: steps.upstream.outputs.already_released == 'true'
        run: echo "Nothing to do"

      - name: Install dependencies
        if: steps.upstream.outputs.already_released == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            desktop-file-utils \
            libfuse2 \
            xvfb \
            x11-utils \
            psmisc \
            wget \
            curl \
            jq \
            file

      - name: Download latest appimagetool (pkgforge-dev)
        if: steps.upstream.outputs.already_released == 'false'
        run: |
          URL=$(gh api repos/pkgforge-dev/appimagetool/releases/latest \
            --jq '.assets[] | select(.name | test("x86_64.*linux$")) | .browser_download_url' | head -n1)
          wget -q "$URL" -O appimagetool
          chmod +x appimagetool
          ./appimagetool --version || true

      - name: Download & extract VSCodium .deb
        if: steps.upstream.outputs.already_released == 'false'
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          DEB_URL="https://github.com/VSCodium/vscodium/releases/download/${VERSION}/codium_${VERSION}_amd64.deb"
          echo "Downloading $DEB_URL"
          wget -q "$DEB_URL" -O codium.deb
          mkdir -p extract
          dpkg-deb -x codium.deb extract
          ls extract/usr/share/codium/bin/codium
          ls extract/usr/share/applications/*.desktop

      - name: Prepare AppDir
        if: steps.upstream.outputs.already_released == 'false'
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          mkdir -p AppDir
          cp -a extract/usr/share/codium AppDir/
          cp extract/usr/share/applications/codium.desktop AppDir/
          sed -i 's|^Exec=.*|Exec=codium %F|' AppDir/codium.desktop
          sed -i 's|^Icon=.*|Icon=codium|' AppDir/codium.desktop
          if [ -f extract/usr/share/pixmaps/vscodium.png ]; then
            cp extract/usr/share/pixmaps/vscodium.png AppDir/codium.png
          elif [ -f extract/usr/share/icons/hicolor/256x256/apps/vscodium.png ]; then
            cp extract/usr/share/icons/hicolor/256x256/apps/vscodium.png AppDir/codium.png
          else
            find extract -name "*.png" | head -n1 | xargs -I{} cp {} AppDir/codium.png
          fi
          ln -sf codium.png AppDir/.DirIcon
          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          if [ -x "${HERE}/codium/bin/codium" ]; then
              exec "${HERE}/codium/bin/codium" "$@"
          else
              echo "Error: codium/bin/codium not found" >&2
              exit 1
          fi
          EOF
          chmod +x AppDir/AppRun
          mkdir -p AppDir/usr/bin
          ln -sf ../../codium/bin/codium AppDir/usr/bin/codium
          echo "AppDir prepared successfully"
          ls -la AppDir/

      - name: Build AppImage (DwarFS + profiling)
        if: steps.upstream.outputs.already_released == 'false'
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          export ARCH=x86_64
          export APPIMAGE_ARCH=x86_64
          export UPINFO="gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|*-x86_64.AppImage.zsync"
          ./appimagetool \
            --optimize-launch \
            --profile-timeout ${{ env.OPTIMIZE_LAUNCH_TIMEOUT }} \
            --dwarfs-comp "${{ env.DWARFS_COMP }}" \
            --update-info "$UPINFO" \
            --arch x86_64 \
            --name "VSCodium-${VERSION}-anylinux-x86_64.AppImage" \
            --output ./dist \
            ./AppDir
          ls -lh dist/
          cd dist
          APPIMAGE=$(ls *.AppImage | head -n1)
          mv "$APPIMAGE" "VSCodium-${VERSION}-anylinux-x86_64.AppImage"
          ls -lh

      - name: Create GitHub Release
        if: steps.upstream.outputs.already_released == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream.outputs.version }}
          name: VSCodium ${{ steps.upstream.outputs.version }} (DwarFS + Profile)
          body: |
            Automatic build of VSCodium AppImage using **pkgforge-dev/appimagetool**.

            - **Filesystem**: DwarFS
            - **Compression**: `${{ env.DWARFS_COMP }}` (maximum)
            - **Launch optimization**: Profile-guided (`--optimize-launch`)
            - Launches via the official `codium/bin/codium` wrapper (correct CLI + proper terminal detachment)

            Upstream: https://github.com/VSCodium/vscodium/releases/tag/${{ steps.upstream.outputs.version }}
          files: |
            dist/*.AppImage
            dist/*.zsync
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
