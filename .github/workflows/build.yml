name: Build VSCodium DwarFS AppImage

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'VSCodium release version (e.g., 1.143.17232)'
        required: true
        type: string

env:
  ARCH: x86_64

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils curl desktop-file-utils libfuse2t64 libgbm1 libnss3 python3 xz-utils xvfb

      - name: Download VSCodium .deb and pkgforge-dev/appimagetool 0.7.0
        run: |
          mkdir -p build && cd build
          curl -fSL "https://github.com/VSCodium/vscodium/releases/download/${VERSION}/codium_${VERSION}_amd64.deb" -o codium.deb
          curl -fSL "https://github.com/pkgforge-dev/appimagetool/releases/download/0.7.0/appimagetool-full-x86_64-linux" -o appimagetool
          chmod +x appimagetool

      - name: Assemble AppDir
        run: |
          cd build
          mkdir -p VSCodium.AppDir
          ar x codium.deb
          tar -xJf data.tar.xz -C VSCodium.AppDir
          cp VSCodium.AppDir/usr/share/applications/com.visualstudio.CodeOSS.desktop VSCodium.AppDir/
          sed -i 's|^Exec=.*|Exec=codium %F|; s|^Icon=.*|Icon=vscodium|' VSCodium.AppDir/com.visualstudio.CodeOSS.desktop
          cp VSCodium.AppDir/usr/share/pixmaps/vscodium.png VSCodium.AppDir/vscodium.png
          ln -sf vscodium.png VSCodium.AppDir/.DirIcon
          mkdir -p VSCodium.AppDir/usr/share/metainfo
          cp VSCodium.AppDir/usr/share/appdata/com.visualstudio.CodeOSS.appdata.xml \
            VSCodium.AppDir/usr/share/metainfo/com.visualstudio.CodeOSS.appdata.xml
          cat << 'EOF' > VSCodium.AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="$HERE/usr/share/codium/bin:$PATH"
          exec "$HERE/usr/share/codium/bin/codium" "$@"
          EOF
          chmod +x VSCodium.AppDir/AppRun

      - name: Build initial AppImage and profile startup access order
        run: |
          cd build
          ./appimagetool --no-appstream VSCodium.AppDir VSCodium-initial.AppImage
          mkdir -p profile-userdata
          xvfb-run -a bash -c '
            export DWARFS_ANALYSIS_FILE="$PWD/vscodium.profile"
            ./VSCodium-initial.AppImage --no-sandbox --user-data-dir="$PWD/profile-userdata" &
            sleep 15
            pkill -f "[.]mount_VSCodi" || true
            sleep 3
          '
          fusermount -u /tmp/.mount_VSCodi* 2>/dev/null || true
          test -s vscodium.profile

      - name: Repack DwarFS with profile ordering
        run: |
          cd build
          OUTPUT="VSCodium-${VERSION}-x86_64.AppImage"
          python3 - << 'EOF'
          with open("VSCodium-initial.AppImage", "rb") as f:
              data = f.read()
          offset = data.find(b"DWARFS\x02", 4096)
          assert offset > 0, "DWARFS superblock not found"
          with open("uruntime.bin", "wb") as out:
              out.write(data[:offset])
          EOF
          if command -v mkdwarfs >/dev/null 2>&1; then
            mkdwarfs -i VSCodium.AppDir -o vscodium.dwarfs -l 6 -B 26 -S 26 \
              --categorize --order=explicit --explicit-order="$PWD/vscodium.profile" \
              --set-owner=0 --set-group=0 --no-progress
            cat uruntime.bin vscodium.dwarfs > "$OUTPUT"
          else
            ./appimagetool --no-appstream VSCodium.AppDir "$OUTPUT"
          fi
          chmod +x "$OUTPUT"
          sha256sum "$OUTPUT" > "${OUTPUT}.sha256"
          ./"$OUTPUT" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSCodium-AppImage-${{ inputs.version }}
          path: |
            build/VSCodium-*-x86_64.AppImage
            build/VSCodium-*-x86_64.AppImage.sha256
