name: Build VSCodium AppImage

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional VSCodium version/tag (for example 1.143.17232)"
        required: false
        type: string
      rebuild:
        description: "Rebuild and replace assets even when this version already has a release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: vscodium-appimage-release
  cancel-in-progress: false

jobs:
  build:
    name: Build x86_64 AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Resolve VSCodium release
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          set -euo pipefail

          if [[ -n "${REQUESTED_VERSION:-}" ]]; then
            version="${REQUESTED_VERSION#v}"
          else
            version="$(gh api repos/VSCodium/vscodium/releases/latest --jq '.tag_name')"
            version="${version#v}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VSCodium version/tag: ${version}" >&2
            exit 1
          fi

          release_exists=false
          if gh release view "${version}" --json tagName >/dev/null 2>&1; then
            release_exists=true
          fi

          should_build=true
          if [[ "${release_exists}" == true && "${REBUILD:-false}" != true ]]; then
            should_build=false
          fi

          {
            echo "version=${version}"
            echo "release_exists=${release_exists}"
            echo "should_build=${should_build}"
          } >> "${GITHUB_OUTPUT}"

          echo "VSCodium version: ${version}"
          echo "Release already exists: ${release_exists}"
          echo "Build required: ${should_build}"

      - name: Skip Build
        if: steps.release.outputs.should_build != 'true'
        run: echo "Build not required. Exiting gracefully."

      - name: Install build essentials
        if: steps.release.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth fuse3 libfuse2
          sudo modprobe fuse || true
          if [[ ! -c /dev/fuse ]]; then
            echo "FUSE is unavailable: /dev/fuse is missing." >&2
            exit 1
          fi
          sudo chmod 666 /dev/fuse
          if ! command -v fusermount >/dev/null 2>&1; then
            sudo ln -sf "$(command -v fusermount3)" /usr/local/bin/fusermount
          fi
          echo "XDG_RUNTIME_DIR=${RUNNER_TEMP}/xdg-runtime" >> "${GITHUB_ENV}"
          mkdir -p "${XDG_RUNTIME_DIR}"
          chmod 0700 "${XDG_RUNTIME_DIR}"

      - name: Install latest pkgforge appimagetool
        id: appimagetool
        if: steps.release.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          APPIMAGETOOL_VERSION="0.6.13"
          TOOL_URL="https://github.com/pkgforge-dev/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64-linux"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 30 \
            -o "${RUNNER_TEMP}/appimagetool" "${TOOL_URL}"
          sudo install -m 0755 "${RUNNER_TEMP}/appimagetool" /usr/local/bin/appimagetool
          echo "version=${APPIMAGETOOL_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Download and extract VSCodium
        if: steps.release.outputs.should_build == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          deb="${RUNNER_TEMP}/codium_${VERSION}_amd64.deb"
          url="https://github.com/VSCodium/vscodium/releases/download/${VERSION}/codium_${VERSION}_amd64.deb"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 30 \
            -o "${deb}" "${url}"
          appdir="${GITHUB_WORKSPACE}/AppDir"
          mkdir -p "${appdir}"
          dpkg-deb -x "${deb}" "${appdir}"

      - name: Prepare AppDir
        if: steps.release.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          appdir="${GITHUB_WORKSPACE}/AppDir"
          required_files=(
            "${appdir}/usr/share/applications/com.visualstudio.CodeOSS.desktop"
            "${appdir}/usr/share/pixmaps/vscodium.png"
            "${appdir}/usr/share/codium/bin/codium"
          )
          for f in "${required_files[@]}"; do
            [[ -f "${f}" ]] || { echo "Missing: ${f}" >&2; exit 1; }
          done
          awk '
            /^Exec=/    { sub(/^Exec=[^[:space:]]+/, "Exec=AppRun") }
            /^TryExec=/ { $0 = "TryExec=AppRun" }
            /^Icon=/    { $0 = "Icon=codium" }
            /^Path=/    { next }
                        { print }
          ' "${required_files[0]}" > "${appdir}/codium.desktop"
          install -m 0644 "${required_files[1]}" "${appdir}/codium.png"
          ln -sfn codium.png "${appdir}/.DirIcon"
          cat > "${appdir}/AppRun" <<'EOF'
          #!/bin/sh
          set -eu
          APPDIR="${APPDIR:-$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)}"
          export APPDIR
          exec "$APPDIR/usr/share/codium/bin/codium" "$@"
          EOF
          chmod 0755 "${appdir}/AppRun"

      - name: Build AppImage
        if: steps.release.outputs.should_build == 'true'
        id: build
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          appdir="${GITHUB_WORKSPACE}/AppDir"
          dist="${GITHUB_WORKSPACE}/dist"
          profile="${RUNNER_TEMP}/codium-${VERSION}.dwarfsprofile"
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          update_info="gh-releases-zsync|${owner}|${repo}|latest|*-x86_64.AppImage.zsync"
          mkdir -p "${dist}"
          APPIMAGE_ARCH=x86_64 ARCH=x86_64 VERSION="${VERSION}" \
            appimagetool --verbose \
              --optimize-launch \
              --profile-timeout 45 \
              --dwarfs-profile "${profile}" \
              --update-info "${update_info}" \
              "${appdir}" \
              --output "${dist}"
          if [[ ! -s "${profile}" ]]; then
            echo "DWARFS profile not generated." >&2; exit 1
          fi
          shopt -s nullglob
          images=("${dist}"/*.AppImage)
          zsyncs=("${dist}"/*.AppImage.zsync)
          if [[ "${#images[@]}" -ne 1 || ! -s "${images[0]}" ]]; then
            echo "Expected exactly one non-empty AppImage." >&2; exit 1
          fi
          if [[ "${#zsyncs[@]}" -ne 1 || ! -s "${zsyncs[0]}" ]]; then
            echo "Expected exactly one non-empty .zsync file." >&2; exit 1
          fi
          (cd "${dist}" && sha256sum *.AppImage *.AppImage.zsync appinfo > SHA256SUMS)
          {
            echo "### VSCodium ${VERSION} AppImage"
            echo ""
            echo "- AppImage: \`$(basename "${images[0]}")\`"
            echo "- Appimagetool: \`${APPIMAGETOOL_VERSION}\`"
            echo "- DWARFS launch profile: generated"
            echo ""
            echo '```text'
            (cd "${dist}" && cat SHA256SUMS)
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish GitHub release
        if: steps.release.outputs.should_build == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_EXISTS: ${{ steps.release.outputs.release_exists }}
          APPIMAGETOOL_VERSION: ${{ steps.appimagetool.outputs.version }}
        run: |
          set -euo pipefail
          dist="${GITHUB_WORKSPACE}/dist"
          title="VSCodium ${VERSION} — DWARFS AppImage"
          notes="$(cat <<EOF
          Built from the upstream VSCodium ${VERSION} AMD64 Debian package.

          - DWARFS compression with launch-profile optimization.
          - Built using pkgforge-dev/appimagetool ${APPIMAGETOOL_VERSION}.
          - Includes the AppImage, zsync metadata, appinfo, and SHA-256 checksums.
          EOF
          )"
          if [[ "${RELEASE_EXISTS}" == true ]]; then
            gh release upload "${VERSION}" "${dist}"/* --clobber
            gh release edit "${VERSION}" --title "${title}" --notes "${notes}"
          else
            gh release create "${VERSION}" "${dist}"/* \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes "${notes}"
          fi
          echo "Published VSCodium ${VERSION} AppImage release."
